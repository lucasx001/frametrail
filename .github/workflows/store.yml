name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version, e.g. 0.0.1'
        type: string
        required: true
      test_only:
        description: 'Use a clearly marked test identity (not for Partner Center submission)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_TEST_ONLY: ${{ inputs.test_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and Store identity
        id: metadata
        env:
          PRODUCT_VERSION: ${{ inputs.version }}
        run: |
          . ./scripts/store-common.ps1
          $release = ConvertTo-FrameTrailReleaseVersion $env:PRODUCT_VERSION
          $identity = Get-FrameTrailStoreIdentity $env:STORE_PACKAGE_NAME $env:STORE_PUBLISHER $env:STORE_PUBLISHER_DISPLAY_NAME -TestOnly:($env:STORE_TEST_ONLY -eq 'true')
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "label=$(if ($identity.TestOnly) { 'TEST-ONLY' } else { 'submission' })" >> $env:GITHUB_OUTPUT
          ./scripts/set-release-version.ps1 -Version $release.Version
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test metadata and prepare Android runtime
        run: |
          ./scripts/test-release.ps1
          ./scripts/test-store.ps1
          ./scripts/setup-android.ps1
      - name: Build application and run tests
        run: ./scripts/build.ps1 -Configuration Release -LockedRestore
      - name: Build source payload and verify archives
        shell: powershell
        run: |
          ./scripts/package.ps1 -SkipBuild -OutputDirectory artifacts/packages/store-source
          ./scripts/verify-package.ps1 -PackageDirectory artifacts/packages/store-source
      - name: Create unsigned Store MSIX with isolated identity and PRI
        shell: powershell
        run: ./scripts/package-store.ps1 -PackageDirectory artifacts/packages/store-source -OutputDirectory artifacts/store -PackageName $env:STORE_PACKAGE_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -TestOnly:($env:STORE_TEST_ONLY -eq 'true')
      - uses: actions/upload-artifact@v4
        with:
          name: FrameTrail-Microsoft-Store-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.label }}
          path: |
            artifacts/store/*.msix
            artifacts/store/store-manifest.json
            artifacts/store/STORE-SUBMISSION.md
            artifacts/store/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameTrail-Store-validation-${{ github.run_id }}
          path: |
            artifacts/test-results/**
            artifacts/store/*.log
          retention-days: 14
